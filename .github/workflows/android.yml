name: Android-App bauen

on:
  push:
    branches: [main]
    paths: ['docs/**', 'android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK bauen
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          gradle -p android assembleRelease --no-daemon
          cp android/app/build/outputs/apk/release/app-release.apk Stundenbuch.apk

      - name: APK als Download bereitstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app
          name: Stundenbuch App
          make_latest: true
          files: Stundenbuch.apk
          body: |
            Aktuelle Version: 1.${{ github.run_number }}

            Auf dem Handy unten bei "Assets" auf **Stundenbuch.apk** tippen, herunterladen und öffnen.
            Beim ersten Mal muss das Installieren aus dieser Quelle (z.B. Chrome) einmal erlaubt werden.
            Neue Versionen einfach drüber installieren, die Einträge bleiben erhalten.
